  "bio": {
    "en": "My research interests center on how agents learn about their environments, make decisions in interaction with others, and shape collective outcomes. Building on my work in spatio-temporal modeling, behavioral understanding, and AI agents, I am increasingly interested in multi-agent and autonomous systems. Transportation and mobility provide a central setting for this work.",
    "zh": "我关注智能主体如何理解环境、在与其他主体的互动中作出决策，以及这些决策如何共同塑造系统层面的结果。基于此前在时空建模、行为理解与 AI Agent 方面的研究积累，我的兴趣逐步转向多智能体与自主系统。交通与出行系统是我开展这些研究的重要场景。"
  },
